function lesson(n){const l=LESSONS[n-1];if(!l){home();return;}app.innerHTML=`<div class="crumb"><a href="#home">ホーム</a><span>›</span><a href="#lessons">講座一覧</a><span>›</span>第${n}回</div><header class="lesson-head"><div><span class="eyebrow">LESSON ${String(n).padStart(2,'0')}</span><h1>${l.icon} ${escapeHTML(l.title)}</h1><p>${escapeHTML(l.subtitle)}</p><div class="lesson-nav">${n>1?`<a href="#lesson-${n-1}">← 前の回</a>`:''}<a href="#lessons">全8回を見る</a>${n<8?`<a href="#lesson-${n+1}">次の回 →</a>`:''}</div></div><img src="${teacherPhoto(n+1)}" alt="第${n}回を案内するルナ先生" loading="lazy"></header><div class="lesson-layout"><aside class="toc"><strong>この回の内容</strong>${l.sections.map((s,i)=>`<a href="#lesson-${n}-part-${i+1}">${i+1}. ${escapeHTML(s.title)}</a>`).join('')}<div class="teacher-mini"><img src="${teacherPhoto(n+4)}" alt="ルナ先生"><span>ご自分のペースでどうぞ♡</span></div></aside><div class="lesson-body">${l.sections.map((s,i)=>`<section class="lesson-section" id="lesson-${n}-part-${i+1}"><div class="part-label">POINT ${i+1}</div><h2>${escapeHTML(s.title)}</h2><p>${escapeHTML(s.description)}</p><h3>🖱️ 操作の手順</h3><ol>${s.steps.map(step=>`<li>${escapeHTML(step)}</li>`).join('')}</ol><div class="prompt-box"><div class="prompt-title"><strong>💬 そのまま使える質問文</strong><button class="copy" data-copy="${i}">コピーする</button></div><p>${escapeHTML(s.prompt)}</p></div><div class="teacher-tip"><img src="${teacherPhoto(n*2+i)}" alt="ルナ先生" loading="lazy"><p>講師ルナからのアドバイス ♡<br><span>${i%2===0?'初めての方も安心してください。一つずつ操作してみましょう。':'画面が説明と違う場合は、端末名と画面の状況をChatGPTに伝えてみてください。'}</span></p></div></section>`).join('')}<div class="bottom-nav"><a class="btn ghost" href="#lessons">← 講座一覧へ</a>${n<8?`<a class="btn" href="#lesson-${n+1}">第${n+1}回へ進む →</a>`:'<a class="btn" href="#home">トップに戻る ♡</a>'}</div></div></div>`;app.querySelectorAll('[data-copy]').forEach(b=>b.addEventListener('click',async()=>{const value=l.sections[Number(b.dataset.copy)].prompt;try{await navigator.clipboard.writeText(value);b.textContent='コピーしました ✓';}catch{const ta=document.createElement('textarea');ta.value=value;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();b.textContent='コピーしました ✓';}setTimeout(()=>b.textContent='コピーする',1700)}));}
function render(){const hash=decodeURIComponent(location.hash.slice(1));if(/^lesson-[1-8]-part-[1-9][0-9]*$/.test(hash)){const n=Number(hash.split('-')[1]);lesson(n);requestAnimationFrame(()=>document.getElementById(hash)?.scrollIntoView());}else if(/^lesson-[1-8]$/.test(hash)){lesson(Number(hash.split('-')[1]));window.scrollTo(0,0);}else{home();if(hash==='lessons')requestAnimationFrame(()=>document.getElementById('lessons')?.scrollIntoView());else window.scrollTo(0,0);}document.querySelectorAll('.menu').forEach(x=>x.classList.remove('open'));document.title=(/^lesson-[1-8](?:-part-[0-9]+)?$/.test(hash)?'第'+hash.split('-')[1]+'回 | ':'')+'ルナのChatGPT完全マスター講座';}
window.addEventListener('hashchange',render);render();document.querySelector('.menu-toggle').addEventListener('click',()=>document.querySelector('.menu').classList.toggle('open'));
</script></body></html>
